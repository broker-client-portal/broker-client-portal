<!DOCTYPE html>
<html lang="en">
<head>
    <title>A CLIENT PORTAL</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="transparent">
    <style>
    [hidden] {
        display: none !important;
        visibility: hidden !important;
    }

    html {
        --text-normal: #1a1a1a;
        --text-muted: #707070;
        --text-active: #000000;
        --background-primary: #f3f4f6;
        --background-secondary: #ffffff;
        --background-tertiary: #e8e9eb;
        --border-color: #d1d1d1;
        --border-color-active: #808080;

        --border-radius-big: 6px;
        --border-radius-small: 4px;

        --page-padding: 16px;
        --header-height: 56px;
        --sidebar-width: 280px;
        --transition-fast: 160ms ease;
    }

    html[dark] {
        --text-normal: #f0f0f0;
        --text-muted: #999999;
        --text-active: #ffffff;
        --background-primary: #0F0F0F;
        --background-secondary: #1a1a1a;
        --background-tertiary: #242424;
        --border-color: #333333;
        --border-color-active: #5a5a5a;
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html, body, .root {
        height: 100%;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        min-height: 100dvh;
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: system-ui, sans-serif;
        font-size: clamp(14px, 1rem, 16px);
        line-height: 1.4;
    }

    .root {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: var(--background-primary);
        color: var(--text-normal);
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
        overflow: hidden;
    }

    header {
        flex: 0 0 auto;
        min-height: var(--header-height);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px var(--page-padding);
        background: var(--background-primary);
        color: var(--text-normal);
        flex-shrink: 0;
        border-bottom: 1px solid var(--border-color);
    }

    header.center {
        justify-content: center;
    }

    main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        overflow: hidden;
        background: var(--background-primary);
    }

    
    button {
        min-height: 40px;
        padding: 0 var(--page-padding);
        font: inherit;
        font-family: inherit;
        color: var(--text-normal);
        border-radius: var(--border-radius-small);
        border: 1px solid var(--border-color);
        background: var(--background-secondary);
        outline: none;
        cursor: pointer;
        user-select: none;
        transition: all var(--transition-fast);
    }
    button:active {
        transform: translateY(1px);
    }
    button:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }
    button:focus {
        border-color: var(--border-color-active);
    }

    .logo {
        flex: 0 0 auto;
        min-width: 0;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: var(--text-active);
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .client-name {
        flex: 0 1 auto;
        margin-left: auto;
        max-width: 40%;
        min-width: 0;
        min-height: 40px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: var(--text-normal);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .client-name span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    .logout {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .logout-dialog-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

    .logout-dialog {
        background: var(--background-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-big);
        width: 100%;
        max-width: 360px;
    }

    .logout-dialog-header {
        padding: var(--page-padding);
        border-bottom: 1px solid var(--border-color);
    }

    .logout-dialog-title {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
        color: var(--text-active);
    }

    .logout-dialog-body {
        padding: var(--page-padding);
    }

    .logout-dialog-message {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--text-normal);
    }

    .logout-dialog-footer {
        padding: var(--page-padding);
        display: flex;
        gap: 12px;
        border-top: 1px solid var(--border-color);
    }

    .logout-dialog-button {
        flex: 1;
    }

    .logout-dialog-confirm:focus,
    .logout-dialog-confirm:hover,
    .logout-dialog-confirm:active {
        border-color: red !important;
        outline: none;
    }

    nav {
        flex: 0 0 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: var(--page-padding);
        background: var(--background-secondary);
        color: var(--text-normal);
        flex-shrink: 0;
        overflow: hidden;
        border-right: 1px solid var(--border-color);
    }

    .menu-profile,
    .menu-accounts,
    .menu-terminal {
        min-height: 48px;
        width: 248px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        border-radius: var(--border-radius-small);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            border-color var(--transition-fast),
            transform var(--transition-fast);
        background: var(--background-secondary);
        color: var(--text-normal);
        border: 1px solid var(--border-color);
    }

    .menu-profile:hover,
    .menu-accounts:hover,
    .menu-terminal:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    .menu-profile.active,
    .menu-accounts.active,
    .menu-terminal.active {
        background: var(--background-primary);
        color: var(--text-active);
        border-color: var(--border-color-active);
        font-weight: 600;
    }
    .menu-theme,
    .menu-toggle {
        min-height: 40px;
        width: 248px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: var(--border-radius-small);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            border-color var(--transition-fast),
            transform var(--transition-fast);
        background: var(--background-primary);
        color: var(--text-normal);
        border: 1px solid var(--border-color);
    }

    .menu-theme {
        margin-top: auto;
    }

    .menu-theme:hover,
    .menu-toggle:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    .menu-theme:active,
    .menu-toggle:active {
        transform: translateY(1px);
    }

    .menu-theme .icon,
    .menu-toggle .icon {
        margin-right: 0;
    }

    nav.collapsed .menu-profile,
    nav.collapsed .menu-accounts,
    nav.collapsed .menu-terminal,
    nav.collapsed .menu-theme,
    nav.collapsed .menu-toggle {
        width: auto;
    }

    nav.collapsed .menu-label {
        display: none;
    }

    nav.collapsed .icon {
        margin-right: 0;
    }

    .view-terminal,
    .login-form {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        box-shadow: none;
    }

    .view-profile,
    .view-accounts {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        box-shadow: none;
    }

    .login-form {
        flex: 1;
        max-width: min(100%, 360px);
        margin: auto;
        display: flex;
        flex-direction: column;
        padding: 32px var(--page-padding);
        height: 100%;
    }
    
    .login-form label {
        height: var(--page-padding);
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-muted);
    }
    
    .login-login,
    .login-password {
        width: 100%;
        min-height: 42px;
        padding: 0 var(--page-padding);
        font: inherit;
        color: var(--text-normal);
        border-radius: var(--border-radius-small);
        border: 1px solid var(--border-color);
        background: var(--background-tertiary);
        outline: none;
        margin-top: calc(0.5 * var(--page-padding));
    }

    .login-login {
        margin-bottom: var(--page-padding);
    }
    
    .login-label-login {
        margin-top: auto;
    }


    .login-submit {
        margin-top: calc(2.5 * var(--page-padding));
        margin-bottom: auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-login:focus,
    .login-password:focus {
        border-color: var(--border-color-active);
        outline: 2px solid var(--border-color-active);
        outline-offset: 0;
    }

    .login-login:hover,
    .login-password:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    .wrong {
        border-color: red !important;
        outline: 2px solid red;
    }

    .login-theme {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        border: none;
    }

    .login-theme .menu-label {
        display: none;
    }

    .login-theme .icon {
        width: 20px;
        height: 20px;
        cursor: pointer;
        color: var(--text-normal);
    }

    .icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        display: block;
        fill: currentColor;
        stroke: currentColor;
    }

    .info-list {
        display: grid;
        gap: 8px;
        margin: 0;
    }

    .info-item {
        display: grid;
        gap: 2px;
    }

    .info-item dt {
        color: var(--text-muted);
        font-size: 0.8rem;
    }

    .info-item dd {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-normal);
    }

    .view-section {
        padding: var(--page-padding);
    }
    .view-section h2 {
        margin: 0 0 var(--page-padding) 0;
    }

    .accounts-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .account-card {
        flex: 1 1 220px;
        max-width: 360px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-small);
        background: var(--background-secondary);
        padding: 10px 12px;
        display: grid;
        gap: 0.5rem;
    }

    .account-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .account-id {
        font-weight: 600;
        color: var(--text-active);
        font-size: 1rem;
    }

    .account-badge {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: var(--border-radius-small);
        border: 1px solid var(--border-color);
        background: var(--background-primary);
        color: var(--text-muted);
        white-space: nowrap;
    }

    .account-status-disabled {
        color: var(--text-muted);
    }

    @media (max-width: 720px) {
        .logo,
        .logout {
            min-height: 44px;
        }

        .logo {
            min-width: auto;
        }

        .logout {
            padding: 0 10px;
        }

        .client-name {
            min-height: 44px;
            flex: 1 1 auto;
            min-width: 0;
        }

        main {
            position: relative;
            flex-direction: row;
            overflow: hidden;
        }

        nav {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 20;
            min-height: 0;
        }
        
        .view-profile,
        .view-accounts,
        .view-terminal
        {
            margin-left: 80px;
        }
        
        .login-form {
            width: min(100%, 360px);
            margin: 0 auto;
            padding: 32px var(--page-padding);
        }
    }

</style>
</head>
<body>
    <div class="root"></div>
    <script>
        let version = 3

        window.dark = !localStorage.theme || localStorage.theme == 0
            ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
            : localStorage.theme == 2
        document.documentElement.toggleAttribute('dark', window.dark)
        if (window.matchMedia) {
            let mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            mediaQuery.addEventListener('change', e => {
                if (localStorage.theme != 0) return
                document.documentElement.toggleAttribute('dark', window.dark = e.matches)
                useAdvancedChartWidget()
            })
        }
        
        let client = null
        let db = [
            {
                profile: {
                    first_name: 'Vladimir',
                    last_name: 'Spirin',
                    email: 'spirin.vladimir@gmail.com',
                    country: 'Russia',
                    login: 'testLogin',
                    password: 'testPassword'
                },
                accounts: [
                    {
                        demo: false,
                        id: 1029384756,
                        currency: 'USD',
                        balance: 10000,
                        leverage: '1:500',
                        status: 'Active'
                    },
                    {
                        demo: true,
                        id: 1029384757,
                        currency: 'USD',
                        balance: 100000,
                        leverage: '1:500',
                        status: 'Active'
                    }
                ]
            },
            {
                profile: {
                    first_name: 'Nikola',
                    last_name: 'Tesla',
                    email: 'nikola.tesla@gmail.com',
                    country: 'Serbia',
                    login: 'f',
                    password: 'f'
                },
                accounts: [
                    {
                        demo: false,
                        id: 2129384758,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'Disabled'
                    },
                    {
                        demo: true,
                        id: 2129384759,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'Disabled'
                    }
                ]
            }
        ]
        
        let root = document.getElementsByClassName('root')[0]
        let header
        let main
        let loginForm
        let loginLogin
        let loginPassword
        let loginSubmit
        let loginThemeControl
        let nav
        let logout
        let logoutDialogOverlay
        let logoutDialog
        let logoutDialogCancel
        let logoutDialogConfirm
        let profileFirstName
        let profileLastName
        let profileEmail
        let profileCountry
        let viewProfile
        let viewAccounts
        let viewTerminal
        let menuProfile
        let menuAccounts
        let menuTerminal
        let menuTheme
        let menuToggle

        let logo = `<svg viewBox="0 0 96 40" width="96" height="40" xmlns="http://www.w3.org/2000/svg" style="display:block;fill:currentColor;font-weight:800;font-family:system-ui,sans-serif;font-size:18px;letter-spacing:0.04em">
            <text x="0" y="26" text-anchor="left">OneRoyal</text>
        </svg>`

        const createTopHeaderNavbar = () => {
            header.classList.remove('center')
            header.innerHTML = `
                <div class="logo">
                    ${logo}
                </div>
                <div class="client-name">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>${client.profile.first_name + ' ' + client.profile.last_name}</span>
                </div>

                <button class="logout">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Sign Out
                </button>
                <div class="logout-dialog-overlay" hidden>
                    <div class="logout-dialog">
                        <div class="logout-dialog-header">
                            <h2 class="logout-dialog-title">Sign out</h2>
                        </div>
                        <div class="logout-dialog-body">
                            <p class="logout-dialog-message">
                                Are you sure you want to sign out from your profile?
                            </p>
                        </div>
                        <div class="logout-dialog-footer">
                            <button class="logout-dialog-button logout-dialog-cancel">Cancel</button>
                            <button class="logout-dialog-button logout-dialog-confirm">Sign out</button>
                        </div>
                    </div>
                </div>
            `

            logout = header.getElementsByClassName('logout')[0]
            logoutDialogOverlay = header.getElementsByClassName('logout-dialog-overlay')[0]
            logoutDialog = logoutDialogOverlay.getElementsByClassName('logout-dialog')[0]
            logoutDialogCancel = logoutDialogOverlay.getElementsByClassName('logout-dialog-cancel')[0]
            logoutDialogConfirm = logoutDialogOverlay.getElementsByClassName('logout-dialog-confirm')[0]
            
            logout.onclick = () => logoutDialogOverlay.hidden = false
            logoutDialogOverlay.onclick = e => {
                if (e.target == logoutDialogConfirm) {
                    localStorage.removeItem('logged')
                    main.innerHTML = ''
                    createLoginForm()
                    return
                }
                if (
                    e.target == logoutDialogCancel ||
                    e.target == logoutDialogOverlay
                ) logoutDialogOverlay.hidden = true
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key == 'Escape') logoutDialogOverlay.hidden = true
        })

        const renderThemeControls = (container, option) =>
            container.innerHTML = option == 0
                ? `<svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor" stroke="none"/></svg><span class="menu-label">OS Default</span>`
                : option == 1
                ? `<svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span class="menu-label">Light</span>`
                : `<svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/></svg><span class="menu-label">Dark</span>`

        const handlerThemeSwitch = container => {
            localStorage.theme = localStorage.theme
                ? (1 + +localStorage.theme) % 3
                : 1
            renderThemeControls(container, localStorage.theme)
            let willBeDark = localStorage.theme == 0
                ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
                : localStorage.theme == 2
            if (willBeDark == window.dark) return
            window.dark = willBeDark
            document.documentElement.toggleAttribute('dark', window.dark)
            if (localStorage.logged) useAdvancedChartWidget()
        }

        const isNarrowScreen = () => window.innerWidth < 720

        const createLeftSideMenu = () => {
            let collapsed = localStorage.left_side_collapsed
                ? localStorage.left_side_collapsed == 'yes'
                : isNarrowScreen()

            main.innerHTML = `
                <nav class="${collapsed ? 'collapsed' : ''}">
                    <div class="menu-profile${!localStorage.nav || localStorage.nav == 'profile' ? ' active' : ''}">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8" cy="9" r="3"/>
                            <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                            <line x1="16" y1="8" x2="22" y2="8"/>
                            <line x1="16" y1="12" x2="21" y2="12"/>
                            <line x1="16" y1="16" x2="20" y2="16"/>
                        </svg>
                        <span class="menu-label">Profile</span>
                    </div>
                    <div class="menu-accounts${localStorage.nav == 'accounts' ? ' active' : ''}">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="5" width="20" height="14" rx="2"/>
                            <line x1="2" y1="10" x2="22" y2="10"/>
                        </svg>
                        <span class="menu-label">Accounts</span>
                    </div>
                    <div class="menu-terminal${localStorage.nav == 'terminal' ? ' active' : ''}">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                        <span class="menu-label">Terminal</span>
                    </div>
                    <div class="menu-theme"></div>
                    <div class="menu-toggle"></div>
                </nav>
            `
            nav = main.getElementsByTagName('nav')[0]
            menuProfile = nav.getElementsByClassName('menu-profile')[0]
            menuAccounts = nav.getElementsByClassName('menu-accounts')[0]
            menuTerminal = nav.getElementsByClassName('menu-terminal')[0]
            menuTheme = nav.getElementsByClassName('menu-theme')[0]
            menuToggle = nav.getElementsByClassName('menu-toggle')[0]

            renderThemeControls(menuTheme, localStorage.theme || 0)

            const renderToggleIcon = collapsed =>
                menuToggle.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        ${collapsed
                            ? '<polyline points="9 18 15 12 9 6"/>'
                            : '<polyline points="15 18 9 12 15 6"/>'}
                    </svg>
                `
            renderToggleIcon(collapsed)
            
            let touchStartX = 0
            let touchStartY = 0
            let touchStartT = 0

            nav.ontouchstart = e => {
                touchStartX = e.changedTouches[0].screenX
                touchStartY = e.changedTouches[0].screenY
                touchStartT = Date.now()
            }

            nav.ontouchend = e => {
                let touchEndX = e.changedTouches[0].screenX
                let dX = touchEndX - touchStartX
                if (Math.abs(dX) < 30) return
                let touchEndY = e.changedTouches[0].screenY
                let dY = touchEndY - touchStartY
                if (Math.abs(dY) > Math.abs(dX)) return
                let touchEndT = Date.now()
                let dT = touchEndT - touchStartT
                if (dT > 1500) return
                let collapsed = dX < 0
                if (collapsed == nav.classList.contains('collapsed')) return
                nav.classList.toggle('collapsed', collapsed)
                localStorage.left_side_collapsed = collapsed ? 'yes' : 'no'
                renderToggleIcon(collapsed)
            }
            
            const collapseMenu = () => {
                if (isNarrowScreen()) {
                    nav.classList.add('collapsed')
                    localStorage.left_side_collapsed = 'yes'
                    renderToggleIcon(true)
                }
            }
            
            window.addEventListener('resize', collapseMenu)

            menuProfile.onclick = () => {
                menuProfile.classList.add('active')
                menuAccounts.classList.remove('active')
                menuTerminal.classList.remove('active')
                viewProfile.hidden = false
                viewAccounts.hidden = true
                viewTerminal.hidden = true
                localStorage.nav = 'profile'
                collapseMenu()
            }
            menuAccounts.onclick = () => {
                menuProfile.classList.remove('active')
                menuAccounts.classList.add('active')
                menuTerminal.classList.remove('active')
                viewProfile.hidden = true
                viewAccounts.hidden = false
                viewTerminal.hidden = true
                localStorage.nav = 'accounts'
                collapseMenu()
            }
            menuTerminal.onclick = () => {
                menuProfile.classList.remove('active')
                menuAccounts.classList.remove('active')
                menuTerminal.classList.add('active')
                viewProfile.hidden = true
                viewAccounts.hidden = true
                viewTerminal.hidden = false
                localStorage.nav = 'terminal'
                if (document.getElementsByClassName('tradingview-widget-container').length == 0) {
                    useAdvancedChartWidget()
                }
                collapseMenu()
            }
            menuTheme.onclick = () => handlerThemeSwitch(menuTheme)
            menuToggle.onclick = () => {
                let collapsed = !nav.classList.contains('collapsed')
                nav.classList.toggle('collapsed', collapsed)
                localStorage.left_side_collapsed = collapsed ? 'yes' : 'no'
                renderToggleIcon(collapsed)
            }
        }
        
        const useAdvancedChartWidget = () => {
            let widget = document.getElementsByClassName('tradingview-widget-container')[0]
            if (widget) viewTerminal.removeChild(widget)
            let tradingviewWidgetContainer = document.createElement('div')
            tradingviewWidgetContainer.classList.add('tradingview-widget-container')
            tradingviewWidgetContainer.style = 'height:100%;width:100%'
            tradingviewWidgetContainer.innerHTML = `
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
            `
            viewTerminal.appendChild(tradingviewWidgetContainer)
            let script = document.createElement('script')
            script.type = 'text/javascript'
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js'
            script.text = JSON.stringify({
                "allow_symbol_change": true,
                "calendar": false,
                "details": true,
                "hide_side_toolbar": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": false,
                "hotlist": true,
                "interval": "1",
                "locale": "en",
                "save_image": true,
                "style": "1",
                "symbol": "Coinbase:BTCUSD",
                "theme": dark ? "dark" : "light",
                "timezone": "Etc/UTC",
                "backgroundColor": dark ? "#0F0F0F" : "#ffffff",
                "gridColor": dark ? "rgba(242, 242, 242, 0.2)" : "rgba(46, 46, 46, 0.2)",
                "watchlist": [],
                "withdateranges": true,
                "compareSymbols": [],
                "studies": [],
                "autosize": true,
            })                    
            tradingviewWidgetContainer.appendChild(script)
        }
        
        const createViews = () => {
            viewProfile = document.createElement('div')
            viewProfile.className = 'view-profile'
            viewProfile.hidden = !!localStorage.nav && localStorage.nav != 'profile'
            viewProfile.innerHTML = `
                <section class="view-section">
                    <h2 id="personal-info">Personal Information</h2>
                    <dl class="info-list">
                        <div class="info-item">
                            <dt>First Name</dt>
                            <dd class="profile-first-name">${client.profile.first_name}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Last Name</dt>
                            <dd class="profile-last-name">${client.profile.last_name}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Email</dt>
                            <dd class="profile-email">${client.profile.email}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Country</dt>
                            <dd class="profile-country">${client.profile.country}</dd>
                        </div>
                    </dl>
                </section>`
            main.appendChild(viewProfile)
            profileFirstName = viewProfile.getElementsByClassName('profile-first-name')[0]
            profileLastName = viewProfile.getElementsByClassName('profile-last-name')[0]
            profileEmail = viewProfile.getElementsByClassName('profile-email')[0]
            profileCountry = viewProfile.getElementsByClassName('profile-country')[0]

            viewAccounts = document.createElement('div')
            viewAccounts.hidden = localStorage.nav != 'accounts'
            viewAccounts.className = 'view-accounts'
            viewAccounts.innerHTML = `
                <section class="view-section">
                    <h2>Accounts</h2>
                    <div class="accounts-grid">
                        ${client.accounts.map(account => `
                            <article class="account-card">
                                <div class="account-card-header">
                                    <span class="account-id">${account.id}</span>
                                    <span class="account-badge">${account.demo ? 'DEMO' : 'LIVE'}</span>
                                </div>
                                <dl class="info-list">
                                    <div class="info-item">
                                        <dt>Currency</dt>
                                        <dd>${account.currency}</dd>
                                    </div>
                                    <div class="info-item">
                                        <dt>Balance</dt>
                                        <dd>${account.currency} ${account.balance}</dd>
                                    </div>
                                    <div class="info-item">
                                        <dt>Leverage</dt>
                                        <dd>${account.leverage}</dd>
                                    </div>
                                    <div class="info-item">
                                        <dt>Status</dt>
                                        <dd${account.status == 'Active' ? '' : ' class="account-status-disabled"'}>${account.status}</dd>
                                    </div>
                                </dl>
                            </article>
                        `).join('')}
                    </div>
                </section>
            `
            main.appendChild(viewAccounts)
            
            viewTerminal = document.createElement('div')
            viewTerminal.hidden = localStorage.nav != 'terminal'
            viewTerminal.className = 'view-terminal'
            main.appendChild(viewTerminal)
        }

        const createLoginForm = () => {
            header.classList.add('center')
            header.innerHTML = `
                <div class="logo">
                    ${logo}
                </div>`

            main.innerHTML = `
                <form class="login-form" method="POST" action="#">
                    <label class="login-label-login" for="login_login">Login</label>
                    <input id="login_login" class="login-login" type="text" name="login" value="testLogin" placeholder="Login" />
                    <label class="login-label-password" for="login_password">Password</label>
                    <input id="login_password" class="login-password" type="password" name="password" value="testPassword" placeholder="Password" />
                    <button class="login-submit" type="submit">
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="8 7 3 12 8 17"/>
                            <line x1="3" y1="12" x2="15" y2="12"/>
                        </svg>
                        Sign In                    
                    </button>
                    <div class="login-theme"></div>
                </form>
            `
            
            loginForm = main.getElementsByClassName('login-form')[0]
            loginLogin = loginForm.getElementsByClassName('login-login')[0]
            loginPassword = loginForm.getElementsByClassName('login-password')[0]
            loginSubmit = loginForm.getElementsByClassName('login-submit')[0]
            loginThemeControl = loginForm.getElementsByClassName('login-theme')[0]
            
            loginForm.onsubmit = e => {
                e.preventDefault()
                client = db.find(({profile}) =>
                    profile.login == loginLogin.value &&
                    profile.password == loginPassword.value
                )
                
                if (client) {
                    localStorage.logged = loginLogin.value
                    main.innerHTML = ''
                    createTopHeaderNavbar()
                    createLeftSideMenu()
                    createViews()
                    if (localStorage.nav == 'terminal') useAdvancedChartWidget()
                } else {
                    loginLogin.classList.add('wrong')
                    loginPassword.classList.add('wrong')
                }
            }

            loginLogin.onfocus =
            loginPassword.onfocus = () => {
                loginLogin.classList.remove('wrong')
                loginPassword.classList.remove('wrong')
            }

            renderThemeControls(loginThemeControl, localStorage.theme || 0)
            loginThemeControl.onclick = () => handlerThemeSwitch(loginThemeControl)
        }

        root.innerHTML = `
            <header></header>
            <main></main>
        `
        header = root.getElementsByTagName('header')[0]
        main = root.getElementsByTagName('main')[0]

        if (localStorage.version != version) {
            // Force user inteface to login again
            // If there major braking changes bump version for ensure logout behavior
            localStorage.removeItem('logged')
            // Here is a place for state migration logic
            if (localStorage.version <= 2 && localStorage.left_side_menu) {
                localStorage.nav = localStorage.left_side_menu
                localStorage.removeItem('left_side_menu')
            }
            localStorage.version = version
        }

        if (localStorage.logged) {
            client = db.find(({profile}) => localStorage.logged == profile.login)
            createTopHeaderNavbar()
            createLeftSideMenu()
            createViews()
            if (localStorage.nav == 'terminal') useAdvancedChartWidget()
        } else {
            createLoginForm()
        }
    </script>
</body>
</html>
