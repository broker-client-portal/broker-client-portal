<!DOCTYPE html>
<html lang="en">
<head>
    <title>A CLIENT PORTAL</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="transparent">
    <style>
    [hidden] {
        display: none !important;
        visibility: hidden !important;
    }

    html {
        --text-normal: #1a1a1a;
        --text-muted: #707070;
        --text-active: #000000;
        --background-primary: #f3f4f6;
        --background-secondary: #ffffff;
        --border-color: #d1d1d1;
        --border-color-active: #808080;

        --border-radius-big: 6px;
        --border-radius-small: 4px;

        --page-padding: 16px;
        --header-height: 56px;
        --sidebar-width: 280px;
        --transition-fast: 160ms ease;
    }

    html[dark] {
        --text-normal: #f0f0f0;
        --text-muted: #999999;
        --text-active: #ffffff;
        --background-primary: #0F0F0F;
        --background-secondary: #1a1a1a;
        --border-color: #333333;
        --border-color-active: #5a5a5a;
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        min-height: 100dvh;
        background: var(--background-primary);
        color: var(--text-normal);
        font-family: system-ui, sans-serif;
        font-size: clamp(14px, 1rem, 16px);
        line-height: 1.4;
    }

    #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: var(--background-primary);
        color: var(--text-normal);
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
        overflow: hidden;
    }

    header {
        flex: 0 0 auto;
        min-height: var(--header-height);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px var(--page-padding);
        background: var(--background-primary);
        color: var(--text-normal);
        flex-shrink: 0;
        border-bottom: 1px solid var(--border-color);
    }

    main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        overflow: hidden;
        background: var(--background-primary);
    }

    #logo {
        flex: 0 0 auto;
        min-width: 0;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: var(--text-active);
    }

    #client_name {
        flex: 0 1 auto;
        margin-left: auto;
        max-width: 40%;
        min-width: 0;
        min-height: 40px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-small);
        background: var(--background-secondary);
        color: var(--text-normal);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #client_name span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #logout {
        flex: 0 0 auto;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-small);
        background: var(--background-secondary);
        color: var(--text-normal);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            border-color var(--transition-fast),
            transform var(--transition-fast);
    }

    #logout:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    #logout:active {
        transform: translateY(1px);
    }

    #left_side_menu {
        flex: 0 0 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: var(--page-padding);
        background: var(--background-secondary);
        color: var(--text-normal);
        flex-shrink: 0;
        overflow: hidden;
        border-right: 1px solid var(--border-color);
    }

    #menu_profile,
    #menu_accounts,
    #menu_terminal {
        min-height: 48px;
        width: 248px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        border-radius: var(--border-radius-small);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            border-color var(--transition-fast),
            transform var(--transition-fast);
        background: var(--background-secondary);
        color: var(--text-normal);
        border: 1px solid var(--border-color);
    }

    #menu_profile:hover,
    #menu_accounts:hover,
    #menu_terminal:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    #menu_profile.active,
    #menu_accounts.active,
    #menu_terminal.active {
        background: var(--background-primary);
        color: var(--text-active);
        border-color: var(--border-color-active);
        font-weight: 600;
    }

    #view_profile,
    #view_accounts,
    #view_terminal,
    #login_form {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        box-shadow: none;
    }

    #login_form {
        width: min(100%, 520px);
        margin: auto;
        display: grid;
        gap: 16px;
        align-content: center;
    }

    #login_login,
    #login_password,
    #login_submit {
        width: 100%;
        min-height: 48px;
        margin: 0;
        padding: 0 14px;
        font: inherit;
        color: var(--text-normal);
        border-radius: var(--border-radius-small);
        border: 1px solid var(--border-color);
        background: var(--background-secondary);
        outline: none;
    }

    #login_login:focus,
    #login_password:focus,
    #login_submit:focus {
        border-color: var(--border-color-active);
        outline: 2px solid var(--border-color-active);
        outline-offset: 0;
    }

    #login_submit {
        cursor: pointer;
        font-weight: 600;
        color: var(--text-active);
        border-color: var(--border-color-active);
    }

    #login_submit:hover {
        color: var(--text-active);
    }

    .wrong {
        border-color: red !important;
        outline: 2px solid red;
    }

    .icon {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        display: block;
        fill: currentColor;
        stroke: currentColor;
    }

    .info-list {
        display: grid;
        gap: 1rem;
        margin: 0;
    }

    .info-item {
        display: grid;
        gap: 0.25rem;
    }

    .info-item dt {
        color: var(--text-muted);
        font-size: 0.875rem;
    }

    .info-item dd {
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-normal);
    }

    .view-section {
        padding: var(--page-padding);
    }

    .accounts-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }

    .account-card {
        flex: 1 1 280px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius-small);
        background: var(--background-secondary);
        padding: 16px;
        display: grid;
        gap: 0.75rem;
    }

    .account-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 0.25rem;
    }

    .account-id {
        font-weight: 600;
        color: var(--text-active);
        font-size: 1rem;
    }

    .account-badge {
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: var(--border-radius-small);
        border: 1px solid var(--border-color);
        background: var(--background-primary);
        color: var(--text-muted);
        white-space: nowrap;
    }

    .account-status-disabled {
        color: var(--text-muted);
    }

    @media (max-width: 720px) {
        #logo,
        #logout {
            min-height: 44px;
        }

        #logo {
            min-width: auto;
            padding: 0 10px;
        }

        #logout {
            padding: 0 10px;
        }

        #client_name {
            min-height: 44px;
            flex: 1 1 auto;
            min-width: 0;
        }

        main {
            position: relative;
            flex-direction: row;
            overflow: hidden;
        }

        #left_side_menu {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 20;
            min-height: 0;
        }

        #view_profile,
        #view_accounts,
        #view_terminal,
        #login_form {
            margin: 0 var(--page-padding) var(--page-padding) 0;
        }

        #login_form {
            width: auto;
        }

        main > div:not(#left_side_menu) {
            margin-left: 80px;
        }
    }

    #menu_toggle {
        min-height: 40px;
        width: 248px;
        display: flex;
        align-items: center;
        margin-top: auto;
        padding: 0 14px;
        border-radius: var(--border-radius-small);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            border-color var(--transition-fast),
            transform var(--transition-fast);
        background: var(--background-primary);
        color: var(--text-normal);
        border: 1px solid var(--border-color);
    }

    #menu_toggle:hover {
        border-color: var(--border-color-active);
        color: var(--text-active);
    }

    #menu_toggle:active {
        transform: translateY(1px);
    }

    #menu_toggle .icon {
        margin-right: 0;
    }

    #left_side_menu.collapsed #menu_profile,
    #left_side_menu.collapsed #menu_accounts,
    #left_side_menu.collapsed #menu_terminal,
    #left_side_menu.collapsed #menu_toggle {
        width: auto;
    }

    #left_side_menu.collapsed .menu-label {
        display: none;
    }

    #left_side_menu.collapsed .icon {
        margin-right: 0;
    }
</style>
</head>
<body>
    <div id="root"></div>
    <script>
        window.dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches
        document.documentElement.toggleAttribute('dark', window.dark)
        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            mediaQuery.addEventListener('change', e => {
                document.documentElement.toggleAttribute('dark', window.dark = e.matches)
                useAdvancedChartWidget()
            })
        }
        
        let client = null
        let db = [
            {
                profile: {
                    first_name: 'Vladimir',
                    last_name: 'Spirin',
                    email: 'spirin.vladimir@gmail.com',
                    country: 'Russia',
                    login: 'testLogin',
                    password: 'testPassword'
                },
                accounts: [
                    {
                        demo: false,
                        id: 1029384756,
                        currency: 'USD',
                        balance: 10000,
                        leverage: '1:500',
                        status: 'Active'
                    },
                    {
                        demo: true,
                        id: 1029384757,
                        currency: 'USD',
                        balance: 100000,
                        leverage: '1:500',
                        status: 'Active'
                    }
                ]
            },
            {
                profile: {
                    first_name: 'Nikola',
                    last_name: 'Tesla',
                    email: 'nikola.tesla@gmail.com',
                    country: 'Serbia',
                    login: 'f',
                    password: 'f'
                },
                accounts: [
                    {
                        demo: false,
                        id: 2129384758,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'Disabled'
                    },
                    {
                        demo: true,
                        id: 2129384759,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'Disabled'
                    }
                ]
            }
        ]
        
        const createTopHeaderNavbar = () => {
            let header = document.createElement('header')
            root.appendChild(header)

            let logo = document.createElement('div')
            logo.id = 'logo'
            logo.innerHTML = `
                <svg viewBox="0 0 96 40" width="96" height="40" xmlns="http://www.w3.org/2000/svg" style="display:block;fill:currentColor;font-weight:800;font-family:system-ui,sans-serif;font-size:18px;letter-spacing:0.04em">
                    <text x="48" y="26" text-anchor="middle" transform="rotate(-24 48 22)">Broker</text>
                </svg>
            `
            header.appendChild(logo)

            let clientName = document.createElement('div')
            clientName.hidden = true
            clientName.id = 'client_name'
            header.appendChild(clientName)
            
            let logout = document.createElement('div')
            logout.hidden = true
            logout.id = 'logout'
            logout.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>Logout
            `
            logout.onpointerup = () => {
                localStorage.removeItem('logged')
                localStorage.removeItem('left_side_menu')
                localStorage.removeItem('left_side_collapsed')
                left_side_menu.classList.remove('collapsed')
                login_form.hidden = false
                left_side_menu.hidden = true
                client_name.hidden = true
                logout.hidden = true
                login_login.value = ''
                login_password.value = ''
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = true
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
            }
            header.appendChild(logout)
        }
        
        const createLeftSideMenu = () => {
            let leftSideMenu = document.createElement('nav')
            leftSideMenu.hidden = true
            leftSideMenu.id = 'left_side_menu'
            main.appendChild(leftSideMenu)

            let menuProfile = document.createElement('div')
            menuProfile.id = 'menu_profile'
            menuProfile.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="8" cy="9" r="3"/>
                    <path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
                    <line x1="16" y1="8" x2="22" y2="8"/>
                    <line x1="16" y1="12" x2="21" y2="12"/>
                    <line x1="16" y1="16" x2="20" y2="16"/>
                </svg><span class="menu-label">Profile</span>
            `
            menuProfile.onpointerup = () => {
                menu_profile.classList.add('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'profile'
                view_profile.hidden = false
                view_accounts.hidden = true
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuProfile)

            let menuAccounts = document.createElement('div')
            menuAccounts.id = 'menu_accounts'
            menuAccounts.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg><span class="menu-label">Accounts</span>
            `
            menuAccounts.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.add('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'accounts'
                view_profile.hidden = true
                view_accounts.hidden = false
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuAccounts)
            
            let menuTerminal = document.createElement('div')
            menuTerminal.id = 'menu_terminal'
            menuTerminal.innerHTML = `
                <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg><span class="menu-label">Terminal</span>
            `
            menuTerminal.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.add('active')
                localStorage.left_side_menu = 'terminal'
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = false
                if (document.getElementsByClassName('tradingview-widget-container').length == 0) {
                    useAdvancedChartWidget()
                }
            }
            leftSideMenu.appendChild(menuTerminal)

            let menuToggle = document.createElement('div')
            menuToggle.id = 'menu_toggle'
            const renderToggleIcon = collapsed =>
                menuToggle.innerHTML = `
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        ${collapsed
                            ? '<polyline points="9 18 15 12 9 6"/>'
                            : '<polyline points="15 18 9 12 15 6"/>'}
                    </svg>
                `

            menuToggle.onpointerup = () => {
                let collapsed = !left_side_menu.classList.contains('collapsed')
                left_side_menu.classList.toggle('collapsed', collapsed)
                localStorage.left_side_collapsed = collapsed ? 'yes' : 'no'
                renderToggleIcon(collapsed)
            }
            leftSideMenu.appendChild(menuToggle)
            let initCollapsed = localStorage.left_side_collapsed == 'yes'
            left_side_menu.classList.toggle('collapsed', initCollapsed)
            renderToggleIcon(initCollapsed)
        }
        
        const useAdvancedChartWidget = () => {
            var widget = document.getElementsByClassName('tradingview-widget-container')[0]
            if (widget) view_terminal.removeChild(widget)
            let tradingviewWidgetContainer = document.createElement('div')
            tradingviewWidgetContainer.classList.add('tradingview-widget-container')
            tradingviewWidgetContainer.style = 'height:100%;width:100%'
            tradingviewWidgetContainer.innerHTML = `
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
            `
            view_terminal.appendChild(tradingviewWidgetContainer)
            let script = document.createElement('script')
            script.type = 'text/javascript'
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js'
            script.text = JSON.stringify({
                "allow_symbol_change": true,
                "calendar": false,
                "details": true,
                "hide_side_toolbar": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": false,
                "hotlist": true,
                "interval": "1",
                "locale": "en",
                "save_image": true,
                "style": "1",
                "symbol": "Binance:BTCUSDT",
                "theme": dark ? "dark" : "light",
                "timezone": "Etc/UTC",
                "backgroundColor": dark ? "#0F0F0F" : "#ffffff",
                "gridColor": dark ? "rgba(242, 242, 242, 0.2)" : "rgba(46, 46, 46, 0.2)",
                "watchlist": [],
                "withdateranges": true,
                "compareSymbols": [],
                "studies": [],
                "autosize": true,
            })                    
            tradingviewWidgetContainer.appendChild(script)
        }
        const renderAccounts = accounts => {
            view_accounts.innerHTML = ''
            let section = document.createElement('section')
            section.className = 'view-section'
            section.innerHTML = `<h2>Accounts</h2>`
            let grid = document.createElement('div')
            grid.className = 'accounts-grid'
            accounts.forEach(account => {
                let card = document.createElement('article')
                card.className = 'account-card'
                card.innerHTML = `
                    <div class="account-card-header">
                        <span class="account-id">${account.id}</span>
                        <span class="account-badge">${account.demo ? 'DEMO' : 'LIVE'}</span>
                    </div>
                    <dl class="info-list">
                        <div class="info-item">
                            <dt>Currency</dt>
                            <dd>${account.currency}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Balance</dt>
                            <dd>${account.currency} ${account.balance}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Leverage</dt>
                            <dd>${account.leverage}</dd>
                        </div>
                        <div class="info-item">
                            <dt>Status</dt>
                            <dd${account.status == 'active' ? '' : ' class="account-status-disabled"'}>${account.status}</dd>
                        </div>
                    </dl>
                `
                grid.appendChild(card)
            })
            section.appendChild(grid)
            view_accounts.appendChild(section)
        }
        
        const createViews = () => {
            let viewProfile = document.createElement('div')
            viewProfile.hidden = true
            viewProfile.id = 'view_profile'
            viewProfile.innerHTML = `
                <section class="view-section" aria-labelledby="personal-info">
                    <h2 id="personal-info">Personal Information</h2>
                    <dl class="info-list">
                        <div class="info-item">
                            <dt>First Name</dt>
                            <dd id="profile_first_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Last Name</dt>
                            <dd id="profile_last_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Email</dt>
                            <dd id="profile_email"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Country</dt>
                            <dd id="profile_country"></dd>
                        </div>
                    </dl>
                </section>`
            main.appendChild(viewProfile)

            let viewAccounts = document.createElement('div')
            viewAccounts.hidden = true
            viewAccounts.id = 'view_accounts'
            main.appendChild(viewAccounts)
            
            let viewTerminal = document.createElement('div')
            viewTerminal.hidden = true
            viewTerminal.id = 'view_terminal'
            main.appendChild(viewTerminal)
        }

        const createLoginForm = () => {
            let form = document.createElement('form')
            form.hidden = true
            form.id = 'login_form'
            form.method = 'POST'
            form.action = '#'
            form.onsubmit = e => {
                e.preventDefault()
                let client = db.find(({profile}) =>
                    profile.login == login_login.value &&
                    profile.password == login_password.value
                )
                
                if (client) {
                    localStorage.logged = login_login.value
                    login_form.hidden = true
                    left_side_menu.hidden = false
                    client_name.innerHTML = `
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg><span>${client.profile.first_name} ${client.profile.last_name}</span>
                    `
                    client_name.hidden = false
                    profile_first_name.textContent = client.profile.first_name
                    profile_last_name.textContent = client.profile.last_name
                    profile_email.textContent = client.profile.email
                    profile_country.textContent = client.profile.country
                    renderAccounts(client.accounts)
                    logout.hidden = false
                    menu_profile.classList.add('active')
                    localStorage.left_side_menu = 'profile'
                    view_profile.hidden = false
                } else {
                    login_login.classList.add('wrong')
                    login_password.classList.add('wrong')
                }
            }
            main.appendChild(form)

            let login = document.createElement('input')
            login.id = 'login_login'
            login.type = 'text'
            login.name = 'login'
            login.placeholder = 'Login'
            form.appendChild(login)

            let password = document.createElement('input')
            password.id = 'login_password'
            password.type = 'password'
            password.name = 'password'
            password.placeholder = 'Password'
            form.appendChild(password)
            
            login.onfocus =
            password.onfocus = () => {
                login_login.classList.remove('wrong')
                login_password.classList.remove('wrong')
            }

            const submit = document.createElement('input')
            submit.id = 'login_submit'
            submit.type = 'submit'
            submit.value = 'Enter'
            form.appendChild(submit)            
        }

        createTopHeaderNavbar()
        let main = document.createElement('main')
        main.id = 'main'
        root.appendChild(main)
        createLeftSideMenu()
        createViews()
        createLoginForm()
        
        if (localStorage.logged) {
            client = db.find(({profile}) => localStorage.logged == profile.login)
            client_name.innerHTML = `
                        <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg><span>${client.profile.first_name} ${client.profile.last_name}</span>
                    `
            client_name.hidden = false
            profile_first_name.textContent = client.profile.first_name
            profile_last_name.textContent = client.profile.last_name
            profile_email.textContent = client.profile.email
            profile_country.textContent = client.profile.country
            renderAccounts(client.accounts)
            logout.hidden = false
            let activeMenu = document.getElementById('menu_' + localStorage.left_side_menu)
            activeMenu.classList.add('active')
            let activeView = document.getElementById('view_' + localStorage.left_side_menu)
            activeView.hidden = false
            left_side_menu.hidden = false
            if (localStorage.left_side_menu == 'terminal') useAdvancedChartWidget()
        } else {
            login_form.hidden = false
        }
    </script>
</body>
</html>
