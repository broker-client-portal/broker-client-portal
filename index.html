<!DOCTYPE html>
<html lang="en">
<head>
    <title>A CLIENT PORTAL</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="transparent">
    <style>
    [hidden] {
        display: none !important;
        visibility: hidden !important;
    }

    html {
        --text-color: #111827;
        --text-muted: #6b7280;
        --active-color: #111827;
        --root-color: #f3f4f6;
        --header-color: #e5e7eb;
        --left-side-menu-color: #eef2f7;
        --surface-color: rgba(255, 255, 255, 0.78);
        --surface-border: rgba(15, 23, 42, 0.08);

        --page-padding: 16px;
        --header-height: 56px;
        --sidebar-width: 280px;
        --surface-radius: 16px;
        --transition-fast: 160ms ease;

        --menu-item-bg: rgba(255, 255, 255, 0.52);
        --menu-item-hover-bg: rgba(255, 255, 255, 0.82);
        --menu-item-border: rgba(15, 23, 42, 0.08);
        --menu-active-bg: #ffffff;
        --menu-active-text: #111827;

        --submenu-bg: rgba(255, 255, 255, 0.5);
        --submenu-border: rgba(15, 23, 42, 0.08);
        --submenu-item-hover-bg: rgba(255, 255, 255, 0.72);
        --submenu-active-bg: #ffffff;
        --submenu-active-text: #111827;

        --focus-ring: 0 0 0 3px rgba(59, 130, 246, 0.22);
    }

    html[dark] {
        --text-color: #f9fafb;
        --text-muted: #9ca3af;
        --active-color: #f9fafb;
        --root-color: #1f2937;
        --header-color: #111827;
        --left-side-menu-color: #17202d;
        --surface-color: rgba(255, 255, 255, 0.05);
        --surface-border: rgba(255, 255, 255, 0.08);

        --menu-item-bg: rgba(255, 255, 255, 0.04);
        --menu-item-hover-bg: rgba(255, 255, 255, 0.1);
        --menu-item-border: rgba(255, 255, 255, 0.08);
        --menu-active-bg: rgba(255, 255, 255, 0.92);
        --menu-active-text: #111827;

        --submenu-bg: rgba(255, 255, 255, 0.04);
        --submenu-border: rgba(255, 255, 255, 0.08);
        --submenu-item-hover-bg: rgba(255, 255, 255, 0.08);
        --submenu-active-bg: rgba(255, 255, 255, 0.9);
        --submenu-active-text: #111827;

        --focus-ring: 0 0 0 3px rgba(96, 165, 250, 0.28);
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        min-height: 100dvh;
        background: var(--root-color);
        color: var(--text-color);
        font-family: system-ui, sans-serif;
        font-size: clamp(14px, 1rem, 16px);
        line-height: 1.4;
    }

    #root {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: var(--root-color);
        color: var(--text-color);
        padding:
            env(safe-area-inset-top)
            env(safe-area-inset-right)
            env(safe-area-inset-bottom)
            env(safe-area-inset-left);
        overflow: hidden;
    }

    header {
        flex: 0 0 auto;
        min-height: var(--header-height);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px var(--page-padding);
        background: var(--header-color);
        color: var(--text-color);
        flex-shrink: 0;
        border-bottom: 1px solid var(--surface-border);
    }

    main {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        overflow: hidden;
    }

    #logo {
        flex: 0 0 auto;
        min-width: 120px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: rgba(255, 255, 255, 0.14);
    }

    #client_name {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 40px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
    }

    #logout {
        flex: 0 0 auto;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.12);
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            transform var(--transition-fast),
            opacity var(--transition-fast);
    }

    #logout:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    #logout:active {
        transform: translateY(1px);
    }

    #left_side_menu {
        flex: 0 0 var(--sidebar-width);
        min-width: 220px;
        max-width: var(--sidebar-width);
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: var(--page-padding);
        background: var(--left-side-menu-color);
        color: var(--text-color);
        flex-shrink: 0;
        overflow: auto;
        border-right: 1px solid var(--surface-border);
    }

    #menu_profile,
    #menu_accounts,
    #menu_terminal {
        min-height: 48px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        border-radius: 12px;
        cursor: pointer;
        user-select: none;
        transition:
            background var(--transition-fast),
            color var(--transition-fast),
            transform var(--transition-fast);
        background: var(--menu-item-bg);
        border: 1px solid var(--menu-item-border);
    }

    #menu_profile:hover,
    #menu_accounts:hover,
    #menu_terminal:hover {
        background: var(--menu-item-hover-bg);
    }

    #menu_profile:active,
    #menu_accounts:active,
    #menu_terminal:active {
        transform: translateY(1px);
    }

    #menu_profile.active,
    #menu_accounts.active,
    #menu_terminal.active {
        background: var(--menu-active-bg);
        color: var(--menu-active-text);
        border-color: transparent;
        font-weight: 600;
    }

    #view_profile,
    #view_accounts,
    #view_terminal,
    #login_form {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        margin: var(--page-padding);
        padding: 20px;
        border-radius: var(--surface-radius);
        background: var(--surface-color);
        border: 1px solid var(--surface-border);
        overflow: auto;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    #view_terminal {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        margin: var(--page-padding);
        padding: 0;
        border: 0;
        border-radius: var(--surface-radius);
        background: transparent;
        overflow: hidden;
        box-shadow: none;
    }

    #terminal_toolbar {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--surface-color);
        border: 1px solid var(--surface-border);
    }

    #terminal_toolbar label {
        flex: 0 0 auto;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-color);
    }

    #instrument_select {
        min-width: 160px;
        min-height: 36px;
        padding: 0 12px;
        font: inherit;
        color: var(--text-color);
        background: var(--root-color);
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        outline: none;
    }

    #instrument_select:focus {
        box-shadow: var(--focus-ring);
        border-color: transparent;
    }
    
    #terminal_chart {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    #login_form {
        width: min(100%, 520px);
        margin: auto;
        display: grid;
        gap: 16px;
        align-content: center;
    }

    #login_login,
    #login_password,
    #login_sumbit {
        width: 100%;
        min-height: 48px;
        margin: 0;
        padding: 0 14px;
        font: inherit;
        color: inherit;
        border-radius: 12px;
        border: 1px solid var(--surface-border);
        background: rgba(255, 255, 255, 0.72);
        outline: none;
    }

    html[dark] #login_login,
    html[dark] #login_password,
    html[dark] #login_sumbit {
        background: rgba(255, 255, 255, 0.06);
    }

    #login_login:focus,
    #login_password:focus,
    #login_sumbit:focus {
        box-shadow: var(--focus-ring);
        border-color: transparent;
    }

    #login_sumbit {
        cursor: pointer;
        font-weight: 600;
        background: var(--menu-active-bg);
        color: var(--menu-active-text);
    }

    #login_sumbit:hover {
        filter: brightness(0.98);
    }

    #login_sumbit:active {
        transform: translateY(1px);
    }

    .wrong {
        border-color: #ef4444 !important;
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
    }

    .info-list {
        display: grid;
        gap: 1rem;
        margin: 0;
    }

    .info-item {
        display: grid;
        gap: 0.25rem;
    }

    .info-item dt {
        color: var(--text-muted);
        font-size: 0.875rem;
    }

    .info-item dd {
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
    }

    @media (max-width: 720px) {
        header {
            flex-wrap: wrap;
            align-items: stretch;
        }

        #logo,
        #logout {
            min-height: 44px;
        }

        #client_name {
            order: 3;
            flex: 1 0 100%;
            min-height: 44px;
        }

        main {
            flex-direction: column;
            overflow: auto;
        }

        #left_side_menu {
            flex: 0 0 auto;
            min-width: 100%;
            max-width: 100%;
            min-height: auto;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 10px;
            border-right: 0;
            border-bottom: 1px solid var(--surface-border);
        }

        #menu_profile,
        #menu_accounts,
        #menu_terminal {
            flex: 1 1 140px;
            justify-content: center;
            min-height: 44px;
            white-space: nowrap;
        }

        #view_profile,
        #view_accounts,
        #view_terminal,
        #login_form {
            margin: 0 var(--page-padding) var(--page-padding);
        }

        #login_form {
            width: auto;
        }
        #terminal_toolbar {
            top: 8px;
            left: 8px;
            right: 8px;
            gap: 8px;
            padding: 8px;
        }
        
        #instrument_select {
            flex: 1 1 auto;
            min-width: 0;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        window.dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches
        document.documentElement.toggleAttribute('dark', window.dark)
        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            mediaQuery.addEventListener('change', e => {
                document.documentElement.toggleAttribute('dark', window.dark = e.matches)
                window.chart?.applyOptions({layout: {background: {color: dark ? '#696969' : '#d3d3d3'}}})
            })
        }
        
        let iDB
        const getDB = () => iDB ??= new Promise((y, n) => {
            try {
                const r = indexedDB.open('candles', 1)
                r.onerror = n
                r.onupgradeneeded = _ => {
                    const db = _.target.result
                    db.createObjectStore('candles', {keyPath: 'symbol'}).transaction.oncomplete = () => y(db)
                }
                r.onsuccess = ({target}) => {
                    y(target.result)
                }
            } catch (e) {
                n(e)
            }
        })

        const loadHistory = symbol =>
            getDB().then(
                db => new Promise(y =>
                    db.transaction('candles', 'readwrite').objectStore('candles').get(symbol).onsuccess = ({srcElement}) => {
                        if (srcElement.result) return y(srcElement.result.candles)
                        let candles = getHistory1s(symbol, 24 * 60 * 60)
                        saveHistory(symbol, candles)
                        return y(candles)
                    }
                )
            )
        const saveHistory = (symbol, candles) =>
            getDB().then(db =>
                db.transaction('candles', 'readwrite').objectStore('candles').put({
                    symbol,
                    candles
                })
            )
        
        let instruments = [
            { symbol: 'EURUSD', type: 'forex', digits: 5 },
            { symbol: 'GBPUSD', type: 'forex', digits: 5 },
            { symbol: 'USDJPY', type: 'forex', digits: 3 },
            { symbol: 'XAUUSD', type: 'metal', digits: 2 },
            { symbol: 'BTCUSD', type: 'crypto', digits: 2 },
        ]
        let series = []
        let client = null
        let db = [
            {
                profile: {
                    first_name: 'Vladimir',
                    last_name: 'Spirin',
                    email: 'spirin.vladimir@gmail.com',
                    country: 'Russia',
                    login: 'testLogin',
                    password: 'testPassword'
                },
                accounts: [
                    {
                        demo: false,
                        id: 1029384756,
                        currency: 'USD',
                        balance: 10000,
                        leverage: '1:500',
                        status: 'active'
                    },
                    {
                        demo: true,
                        id: 1029384757,
                        currency: 'USD',
                        balance: 100000,
                        leverage: '1:500',
                        status: 'active'
                    }
                ]
            },
            {
                profile: {
                    first_name: 'Nikola',
                    last_name: 'Tesla',
                    email: 'nikola.tesla@gmail.com',
                    country: 'Serbia',
                    login: 'f',
                    password: 'f'
                },
                accounts: [
                    {
                        demo: false,
                        id: 2129384758,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'disabled'
                    },
                    {
                        demo: true,
                        id: 2129384759,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'disabled'
                    }
                ]
            }
        ]
        
        const realtimeCandleStream = () => {
            let timeNowSec = Date.now() / 1000
            Object.keys(series).forEach(symbol => {
                let candles = series[symbol].data()
                let lastCandle = candles[candles.length - 1]
                let candle
                while (lastCandle.time < timeNowSec) {
                    candle = generateCandle(symbol, lastCandle.time + 1, lastCandle.close)
                    candles.push(candle)
                    lastCandle = candle
                }
                series[symbol].setData(candles)
                chart.timeScale().fitContent()
                saveHistory(symbol, candles)
            })
            setTimeout(realtimeCandleStream, 1000)
        }
        
        const createTopHeaderNavbar = () => {
            let header = document.createElement('header')
            root.appendChild(header)

            let logo = document.createElement('div')
            logo.id = 'logo'
            logo.textContent = 'Logo'
            header.appendChild(logo)

            let clientName = document.createElement('div')
            clientName.hidden = true
            clientName.id = 'client_name'
            header.appendChild(clientName)
            
            let logout = document.createElement('div')
            logout.hidden = true
            logout.id = 'logout'
            logout.textContent = 'Logout'
            logout.onpointerup = () => {
                localStorage.removeItem('logged')
                localStorage.removeItem('left_side_menu')
                localStorage.removeItem('instrument')
                login_form.hidden = false
                left_side_menu.hidden = true
                client_name.hidden = true
                logout.hidden = true
                login_login.value = ''
                login_password.value = ''
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = true
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
            }
            header.appendChild(logout)
        }
        
        const createLeftSideMenu = () => {
            let leftSideMenu = document.createElement('div')
            leftSideMenu.hidden = true
            leftSideMenu.id = 'left_side_menu'
            main.appendChild(leftSideMenu)

            let menuProfile = document.createElement('div')
            menuProfile.id = 'menu_profile'
            menuProfile.textContent = 'Profile'
            menuProfile.onpointerup = () => {
                menu_profile.classList.add('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'profile'
                view_profile.hidden = false
                view_accounts.hidden = true
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuProfile)

            let menuAccounts = document.createElement('div')
            menuAccounts.id = 'menu_accounts'
            menuAccounts.textContent = 'Accounts'
            menuAccounts.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.add('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'accounts'
                view_profile.hidden = true
                view_accounts.hidden = false
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuAccounts)
            
            let menuTerminal = document.createElement('div')
            menuTerminal.id = 'menu_terminal'
            menuTerminal.textContent = 'Terminal'
            menuTerminal.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.add('active')
                localStorage.left_side_menu = 'terminal'
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = false
                if (!window.chartingLibraryReady) initChart()
            }
            leftSideMenu.appendChild(menuTerminal)
        }
        const createViews = () => {
            let viewProfile = document.createElement('div')
            viewProfile.hidden = true
            viewProfile.id = 'view_profile'
            viewProfile.innerHTML = `
                <section aria-labelledby="personal-info">
                    <h2 id="personal-info">Personal Information</h2>
                    <dl class="info-list">
                        <div class="info-item">
                            <dt>First Name</dt>
                            <dd id="profile_first_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Last Name</dt>
                            <dd id="profile_last_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Email</dt>
                            <dd id="profile_email"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Country</dt>
                            <dd id="profile_country"></dd>
                        </div>
                    </dl>
                </section>`
            main.appendChild(viewProfile)

            let viewAccounts = document.createElement('div')
            viewAccounts.hidden = true
            viewAccounts.id = 'view_accounts'
            viewAccounts.textContent = 'My Accounts table..'
            main.appendChild(viewAccounts)
            
            let viewTerminal = document.createElement('div')
            viewTerminal.hidden = true
            viewTerminal.id = 'view_terminal'
            main.appendChild(viewTerminal)
            
            let terminalToolbar = document.createElement('div')
            terminalToolbar.id = 'terminal_toolbar'
            viewTerminal.appendChild(terminalToolbar)
            
            let terminalChart = document.createElement('div')
            terminalChart.id = 'terminal_chart'
            viewTerminal.appendChild(terminalChart)
            
            let labelInstrumentSelect = document.createElement('label')
            labelInstrumentSelect.setAttribute('for', 'instrument_select')
            labelInstrumentSelect.textContent = 'Instrument'
            terminalToolbar.appendChild(labelInstrumentSelect)
            
            let selectInstrument = document.createElement('select')
            selectInstrument.id = 'instrument_select'
            selectInstrument.onchange = e => {
                let {symbol} = instruments[selectInstrument.selectedIndex]
                if (localStorage.instrument == symbol) return
                series[localStorage.instrument].applyOptions({visible: false})
                if (series[symbol]) {
                    series[symbol].applyOptions({visible: true})
                } else {
                    loadHistory(symbol)
                    .then(candles => {
                        series[symbol] = chart.addSeries(LightweightCharts.CandlestickSeries)
                        series[symbol].setData(candles)
                        chart.timeScale().fitContent()
                    })
                }
                localStorage.instrument = symbol
            }
            terminalToolbar.appendChild(selectInstrument)
            
            instruments.forEach(instrument => {
                let optionInstrument = document.createElement('option')
                optionInstrument.value = instrument.symbol
                optionInstrument.textContent = instrument.symbol
                selectInstrument.appendChild(optionInstrument)
            })
        }

        const createLoginForm = () => {
            let form = document.createElement('form')
            form.hidden = true
            form.id = 'login_form'
            form.method = 'POST'
            form.action = '#'
            form.onsubmit = e => {
                e.preventDefault()
                let client = db.find(({profile}) =>
                    profile.login == login_login.value &&
                    profile.password == login_password.value
                )
                
                if (client) {
                    localStorage.logged = login_login.value
                    login_form.hidden = true
                    left_side_menu.hidden = false
                    client_name.textContent = client.profile.first_name + ' ' + client.profile.last_name
                    client_name.hidden = false
                    profile_first_name.textContent = client.profile.first_name
                    profile_last_name.textContent = client.profile.last_name
                    profile_email.textContent = client.profile.email
                    profile_country.textContent = client.profile.country
                    logout.hidden = false
                    menu_profile.classList.add('active')
                    localStorage.left_side_menu = 'profile'
                    localStorage.instrument = instruments[0].symbol
                    view_profile.hidden = false
                } else {
                    login_login.classList.add('wrong')
                    login_password.classList.add('wrong')
                }
            }
            main.appendChild(form)

            let login = document.createElement('input')
            login.id = 'login_login'
            login.type = 'text'
            login.name = 'login'
            login.placeholder = 'Login'
            form.appendChild(login)

            let password = document.createElement('input')
            password.id = 'login_password'
            password.type = 'password'
            password.name = 'password'
            password.placeholder = 'Password'
            form.appendChild(password)
            
            login.onfocus =
            password.onfocus = () => {
                login_login.classList.remove('wrong')
                login_password.classList.remove('wrong')
            }

            const submit = document.createElement('input')
            submit.id = 'login_sumbit'
            submit.type = 'submit'
            submit.value = 'Enter'
            form.appendChild(submit)            
        }

        const initChart = () => {
            let urlChartingLibrary = 'https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js'
            window.chartingLibraryReady ??= caches.open('charting_library')
            .then(c =>
                c.match(urlChartingLibrary)
                .then(r =>
                    r || fetch(urlChartingLibrary)
                    .then(r =>
                        r.ok && c.put(urlChartingLibrary, r.clone()).then(_ => r)
                    )
                )
            )
            .then(_ => _.text())
            .then(_ => eval(_))

            return chartingLibraryReady
            .then(() => {
                window.chart = LightweightCharts.createChart(view_terminal, {
                    width: view_terminal.clientWidth,
                    height: view_terminal.clientHeight,
                    layout: {
                        background: {color: dark ? '#696969' : '#d3d3d3'},
                        textColor: dark ? '#000000' : '#ffffff',
                        borderColor: '#808080'
                    },
                    grid: {
                        vertLines: {color: '#808080'},
                        horzLines: {color: '#808080'}
                    },
                    timeScale: { visible: false },
                    rightPriceScale: { visible: false }
                })
                
                series[localStorage.instrument] ??= chart.addSeries(LightweightCharts.CandlestickSeries)
                
                loadHistory(localStorage.instrument)
                .then(candles => {
                    series[localStorage.instrument].setData(candles)
                    chart.timeScale().fitContent()
                    realtimeCandleStream()
                })
            })
        }

        const resizeChart = () =>
            chart.applyOptions({
                width: view_terminal.clientWidth,
                height: view_terminal.clientHeight
            })
        
        window.addEventListener('resize', resizeChart)
        window.addEventListener('orientationchange', resizeChart)

        createTopHeaderNavbar()
        let main = document.createElement('main')
        main.id = 'main'
        root.appendChild(main)
        createLeftSideMenu()
        createViews()
        createLoginForm()
        
        if (localStorage.logged) {
            client = db.find(({profile}) => localStorage.logged == profile.login)
            client_name.textContent = client.profile.first_name + ' ' + client.profile.last_name
            client_name.hidden = false
            profile_first_name.textContent = client.profile.first_name
            profile_last_name.textContent = client.profile.last_name
            profile_email.textContent = client.profile.email
            profile_country.textContent = client.profile.country
            logout.hidden = false
            let activeMenu = document.getElementById('menu_' + localStorage.left_side_menu)
            activeMenu.classList.add('active')
            let activeView = document.getElementById('view_' + localStorage.left_side_menu)
            activeView.hidden = false
            left_side_menu.hidden = false
            if (localStorage.left_side_menu == 'terminal') initChart()
        } else {
            login_form.hidden = false
        }

        let currentPrice = {
            EURUSD: 1.2,
            GBPUSD: 1.7,
            USDJPY: 20,
            XAUUSD: 3403,
            BTCUSD: 65031
        }
        let currentVolume = {
            EURUSD: 1e4,
            GBPUSD: 2e3,
            USDJPY: 7e4,
            XAUUSD: 2e5,
            BTCUSD: 1e6
        }
        const getCurrentPrice = symbol => currentPrice[symbol] * (1 + (0.5 - Math.random()) / 20)
        const generateCandle = (symbol, time, closePricePrevCandle) => {
            let open = closePricePrevCandle
            let close = closePricePrevCandle * (1 + (0.5 - Math.random()) / 20)
            return {
                time,
                open,
                close,
                high: Math.max(open, close) * (1 + Math.random() / 30),
                low: Math.min(open, close) * (1 - Math.random() / 30),
                volume: Math.floor(currentVolume[symbol] * (1 + (0.5 - Math.random()) / 20))
            }
        }
        const getHistory1s = (symbol, secondsBefore) => {
            let candles = []
            let price = currentPrice[symbol]
            let timeNowSec = Date.now() / 1000
            let oneSec = 1
            let timeFirstCandle = timeNowSec - oneSec * secondsBefore
            for (let time = timeFirstCandle; time <= timeNowSec; time += oneSec) {
                const candle = generateCandle(symbol, time, price)
                price = candle.close
                candles.push(candle)
            }
            return candles
        }
    </script>
</body>
