<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="https://charting-library.tradingview-widget.com/datafeeds/udf/dist/bundle.js"></script>
    <title>A CLIENT PORTAL</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="transparent">
    <style>
        [hidden] {
            display: none !important;
            visibility: hidden !important;
        }
        html {
            --text-color: white;
            --active-color: black;
            --root-color: lightgray;
            --header-color: gray;
            --left-side-menu-color: gray;
            --page-padding: 16px;
            --header-height: 56px;
            --sidebar-width: 280px;
            --surface-radius: 16px;
            --transition-fast: 160ms ease;
        }

        html[dark] {
            --text-color: black;
            --active-color: white;
            --root-color: dimgray;
            --header-color: gray;
            --left-side-menu-color: gray;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
            background: var(--root-color);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            font-size: clamp(14px, 1rem, 16px);
            line-height: 1.4;
        }

        #root {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--root-color);
            color: var(--text-color);
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
            overflow: hidden;
        }
        header {
            flex: 0 0 auto;
            min-height: var(--header-height);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px var(--page-padding);
            background: var(--header-color);
            color: var(--text-color);
            flex-shrink: 0;
        }
        main {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            overflow: hidden;
        }
        #logo {
            flex: 0 0 auto;
            min-width: 120px;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.08);
        }
        #client_name {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 40px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #logout {
            flex: 0 0 auto;
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            user-select: none;
            transition:
                background var(--transition-fast),
                transform var(--transition-fast),
                opacity var(--transition-fast);
        }

        #logout:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        #logout:active {
            transform: translateY(1px);
        }

        @media (max-width: 720px) {
            header {
                flex-wrap: wrap;
                align-items: stretch;
            }

            #logo,
            #logout {
                min-height: 44px;
            }

            #client_name {
                order: 3;
                flex: 1 0 100%;
                min-height: 44px;
            }
        }
        #left_side_menu {
            flex: 0 0 var(--sidebar-width);
            min-width: 220px;
            max-width: var(--sidebar-width);
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: var(--page-padding);
            background: var(--left-side-menu-color);
            color: var(--text-color);
            flex-shrink: 0;
            overflow: auto;
        }

        #menu_profile,
        #menu_accounts,
        #menu_terminal {
            min-height: 48px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            transition:
                background var(--transition-fast),
                color var(--transition-fast),
                transform var(--transition-fast);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #menu_profile:active,
        #menu_accounts:active,
        #menu_terminal:active {
            transform: translateY(1px);
        }

        #menu_profile:hover,
        #menu_accounts:hover,
        #menu_terminal:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        
        #menu_profile.active,
        #menu_accounts.active,
        #menu_terminal.active {
            background: var(--active-color);
            color: var(--root-color);
            border-color: transparent;
            font-weight: 600;
        }

        @media (max-width: 720px) {
            main {
                flex-direction: column;
                overflow: auto;
            }
            
            #left_side_menu {
                flex: 0 0 auto;
                min-width: 100%;
                max-width: 100%;
            }
            
            #view_profile,
            #view_accounts,
            #view_terminal,
            #login_form {
                margin: 0 var(--page-padding) var(--page-padding);
            }
        }

        #view_profile,
        #view_accounts,
        #view_terminal,
        #login_form {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            margin: var(--page-padding);
            padding: 20px;
            border-radius: var(--surface-radius);
            background: rgba(255, 255, 255, 0.08);
            overflow: auto;
        }

        #view_terminal {
            padding: 0;
            overflow: hidden;
        }
        
        #login_form {
            width: min(100%, 520px);
            align-self: center;
        }       
        #login_login {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 20%;
            font-size: 3vw; 
            font-family: "system-ui";
            box-sizing: border-box; 
            display: flex;
            align-items: center;
        }
        #login_password {
            position: absolute;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 20%;
            font-size: 3vw; 
            font-family: "system-ui";
            box-sizing: border-box; 
            display: flex;
            align-items: center;
        }
        #login_sumbit {
            position: absolute;
            top: 70%;
            left: 10%;
            width: 80%;
            height: 20%;
            font-size: 3vw; 
            font-family: "system-ui";
            box-sizing: border-box; 
            display: flex;
            align-items: center;
        }
        
        .wrong {
            border: solid 2px red;
        }
        .active {
            color: var(--active-color)
        }
        
        .info-list {
            display: grid;
            gap: 1rem;
            margin: 0;
        }
        
        .info-item {
            display: grid;
            gap: 0.25rem;
        }
        
        .info-item dt {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .info-item dd {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
        }

    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        window.dark = window.matchMedia?.('(prefers-color-scheme: dark)').matches
        document.documentElement.toggleAttribute('dark', window.dark)
        if (window.matchMedia) {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
            mediaQuery.addEventListener('change', e => {
                document.documentElement.toggleAttribute('dark', window.dark = e.matches)
                window.chart?.applyOptions({layout: {background: {color: dark ? '#696969' : '#d3d3d3'}}})
            })
        }
        
        let iDB
        const getDB = () => iDB ??= new Promise((y, n) => {
            try {
                const r = indexedDB.open('candles', 1)
                r.onerror = n
                r.onupgradeneeded = _ => {
                    const db = _.target.result
                    db.createObjectStore('candles', {keyPath: 'symbol'}).transaction.oncomplete = () => y(db)
                }
                r.onsuccess = ({target}) => {
                    y(target.result)
                }
            } catch (e) {
                n(e)
            }
        })

        const loadHistory = symbol =>
            getDB().then(
                db => new Promise(y =>
                    db.transaction('candles', 'readwrite').objectStore('candles').get(symbol).onsuccess = ({srcElement}) => {
                        if (srcElement.result) return y(srcElement.result.candles)
                        let candles = getHistory1d(symbol, 365)
                        saveHistory(symbol, candles)
                        return y(candles)
                    }
                )
            )
        const saveHistory = (symbol, candles) =>
            getDB().then(db =>
                db.transaction('candles', 'readwrite').objectStore('candles').put({
                    symbol,
                    candles
                })
            )
        
        let instruments = [
            { symbol: 'EURUSD', type: 'forex', digits: 5 },
            { symbol: 'GBPUSD', type: 'forex', digits: 5 },
            { symbol: 'USDJPY', type: 'forex', digits: 3 },
            { symbol: 'XAUUSD', type: 'metal', digits: 2 },
            { symbol: 'BTCUSD', type: 'crypto', digits: 2 },
        ]
        let series = []
        let client = null
        let db = [
            {
                profile: {
                    first_name: 'Vladimir',
                    last_name: 'Spirin',
                    email: 'spirin.vladimir@gmail.com',
                    country: 'Russia',
                    login: 'testLogin',
                    password: 'testPassword'
                },
                accounts: [
                    {
                        demo: false,
                        id: 1029384756,
                        currency: 'USD',
                        balance: 10000,
                        leverage: '1:500',
                        status: 'active'
                    },
                    {
                        demo: true,
                        id: 1029384757,
                        currency: 'USD',
                        balance: 100000,
                        leverage: '1:500',
                        status: 'active'
                    }
                ]
            },
            {
                profile: {
                    first_name: 'Nikola',
                    last_name: 'Tesla',
                    email: 'nikola.tesla@gmail.com',
                    country: 'Serbia',
                    login: 'f',
                    password: 'f'
                },
                accounts: [
                    {
                        demo: false,
                        id: 2129384758,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'disabled'
                    },
                    {
                        demo: true,
                        id: 2129384759,
                        currency: 'EUR',
                        balance: 1000,
                        leverage: '1:1',
                        status: 'disabled'
                    }
                ]
            }
        ]
        
        const createTopHeaderNavbar = () => {
            let header = document.createElement('header')
            root.appendChild(header)

            let logo = document.createElement('div')
            logo.id = 'logo'
            logo.textContent = 'Logo'
            header.appendChild(logo)

            let clientName = document.createElement('div')
            clientName.hidden = true
            clientName.id = 'client_name'
            header.appendChild(clientName)
            
            let logout = document.createElement('div')
            logout.hidden = true
            logout.id = 'logout'
            logout.textContent = 'Logout'
            logout.onpointerup = () => {
                localStorage.removeItem('logged')
                localStorage.removeItem('left_side_menu')
                localStorage.removeItem('instrument')
                login_form.hidden = false
                left_side_menu.hidden = true
                client_name.hidden = true
                logout.hidden = true
                login_login.value = ''
                login_password.value = ''
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = true
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
            }
            header.appendChild(logout)
        }
        
        const createLeftSideMenu = () => {
            let leftSideMenu = document.createElement('div')
            leftSideMenu.hidden = true
            leftSideMenu.id = 'left_side_menu'
            main.appendChild(leftSideMenu)

            let menuProfile = document.createElement('div')
            menuProfile.id = 'menu_profile'
            menuProfile.textContent = 'Profile'
            menuProfile.onpointerup = () => {
                menu_profile.classList.add('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'profile'
                view_profile.hidden = false
                view_accounts.hidden = true
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuProfile)

            let menuAccounts = document.createElement('div')
            menuAccounts.id = 'menu_accounts'
            menuAccounts.textContent = 'Accounts'
            menuAccounts.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.add('active')
                menu_terminal.classList.remove('active')
                localStorage.left_side_menu = 'accounts'
                view_profile.hidden = true
                view_accounts.hidden = false
                view_terminal.hidden = true
            }
            leftSideMenu.appendChild(menuAccounts)
            
            let menuTerminal = document.createElement('div')
            menuTerminal.id = 'menu_terminal'
            menuTerminal.textContent = 'Terminal'
            menuTerminal.onpointerup = () => {
                menu_profile.classList.remove('active')
                menu_accounts.classList.remove('active')
                menu_terminal.classList.add('active')
                localStorage.left_side_menu = 'terminal'
                view_profile.hidden = true
                view_accounts.hidden = true
                view_terminal.hidden = false
                if (!window.chartingLibraryReady) initChart()
            }
            leftSideMenu.appendChild(menuTerminal)
            
            let menuInstruments = document.createElement('div')
            menuInstruments.id = 'menu_instruments'
            menuInstruments.hidden = true
            menuInstruments.innerHTML = instruments.map(instrument =>
                `<div id="${instrument.symbol}" class="instrument${localStorage.instrument == instrument.symbol ? ' active' : ''}">${instrument.symbol}</div>`
            ).join('')
            menuInstruments.onpointerup = e => {
                let symbol = e.target.id
                if (localStorage.instrument == symbol) return
                document.getElementById(localStorage.instrument).classList.remove('active')
                e.target.classList.add('active')
                series[localStorage.instrument].applyOptions({visible: false})
                if (series[symbol]) {
                    series[localStorage.instrument].applyOptions({visible: true})
                } else {
                    loadHistory(symbol)
                    .then(candles => {
                        series[symbol] = chart.addSeries(LightweightCharts.CandlestickSeries)
                        series[symbol].setData(candles)
                        chart.timeScale().fitContent()
                    })
                }
                localStorage.instrument = symbol
            }
            menuTerminal.appendChild(menuInstruments)
        }
        const createViews = () => {
            let viewProfile = document.createElement('div')
            viewProfile.hidden = true
            viewProfile.id = 'view_profile'
            viewProfile.innerHTML = `
                <section aria-labelledby="personal-info">
                    <h2 id="personal-info">Personal Information</h2>
                    <dl class="info-list">
                        <div class="info-item">
                            <dt>First Name</dt>
                            <dd id="profile_first_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Last Name</dt>
                            <dd id="profile_last_name"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Email</dt>
                            <dd id="profile_email"></dd>
                        </div>
                        <div class="info-item">
                            <dt>Country</dt>
                            <dd id="profile_country"></dd>
                        </div>
                    </dl>
                </section>`
            main.appendChild(viewProfile)

            let viewAccounts = document.createElement('div')
            viewAccounts.hidden = true
            viewAccounts.id = 'view_accounts'
            viewAccounts.textContent = 'My Accounts table..'
            main.appendChild(viewAccounts)
            
            let viewTerminal = document.createElement('div')
            viewTerminal.hidden = true
            viewTerminal.id = 'view_terminal'
            main.appendChild(viewTerminal)
        }

        const createLoginForm = () => {
            let form = document.createElement('form')
            form.hidden = true
            form.id = 'login_form'
            form.method = 'POST'
            form.action = '#'
            form.onsubmit = e => {
                e.preventDefault()
                let client = db.find(({profile}) =>
                    profile.login == login_login.value &&
                    profile.password == login_password.value
                )
                
                if (client) {
                    localStorage.logged = login_login.value
                    login_form.hidden = true
                    left_side_menu.hidden = false
                    client_name.textContent = client.profile.first_name + ' ' + client.profile.last_name
                    client_name.hidden = false
                    profile_first_name.textContent = client.profile.first_name
                    profile_last_name.textContent = client.profile.last_name
                    profile_email.textContent = client.profile.email
                    profile_country.textContent = client.profile.country
                    logout.hidden = false
                    menu_profile.classList.add('active')
                    localStorage.left_side_menu = 'profile'
                    localStorage.instrument = instruments[0].symbol
                    view_profile.hidden = false
                } else {
                    login_login.classList.add('wrong')
                    login_password.classList.add('wrong')
                }
            }
            main.appendChild(form)

            let login = document.createElement('input')
            login.id = 'login_login'
            login.type = 'text'
            login.name = 'login'
            login.placeholder = 'Login'
            form.appendChild(login)

            let password = document.createElement('input')
            password.id = 'login_password'
            password.type = 'password'
            password.name = 'password'
            password.placeholder = 'Password'
            form.appendChild(password)
            
            login.onfocus =
            password.onfocus = () => {
                login_login.classList.remove('wrong')
                login_password.classList.remove('wrong')
            }

            const submit = document.createElement('input')
            submit.id = 'login_sumbit'
            submit.type = 'submit'
            submit.value = 'Enter'
            form.appendChild(submit)            
        }

        const initChart = () => {
            let urlChartingLibrary = 'https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js'
            window.chartingLibraryReady ??= caches.open('charting_library')
            .then(c =>
                c.match(urlChartingLibrary)
                .then(r =>
                    r || fetch(urlChartingLibrary)
                    .then(r =>
                        r.ok && c.put(urlChartingLibrary, r.clone()).then(_ => r)
                    )
                )
            )
            .then(_ => _.text())
            .then(_ => eval(_))

            return chartingLibraryReady
            .then(() => {
                window.chart = LightweightCharts.createChart(view_terminal, {
                    width: view_terminal.clientWidth,
                    height: view_terminal.clientHeight,
                    layout: {
                        background: {color: dark ? '#696969' : '#d3d3d3'},
                        textColor: dark ? '#000000' : '#ffffff',
                        borderColor: '#808080'
                    },
                    grid: {
                        vertLines: {color: '#808080'},
                        horzLines: {color: '#808080'}
                    },
                    timeScale: { visible: false },
                    rightPriceScale: { visible: false }
                })
                
                series[localStorage.instrument] ??= chart.addSeries(LightweightCharts.CandlestickSeries)
                
                loadHistory(localStorage.instrument)
                .then(candles => {
                    series[localStorage.instrument].setData(candles)
                    chart.timeScale().fitContent()
                    menu_instruments.hidden = false
                })
            })
        }

        const resizeChart = () =>
            chart.applyOptions({
                width: view_terminal.clientWidth,
                height: view_terminal.clientHeight
            })
        
        window.addEventListener('resize', resizeChart)
        window.addEventListener('orientationchange', resizeChart)

        createTopHeaderNavbar()
        let main = document.createElement('main')
        main.id = 'main'
        root.appendChild(main)
        createLeftSideMenu()
        createViews()
        createLoginForm()
        
        if (localStorage.logged) {
            client = db.find(({profile}) => localStorage.logged == profile.login)
            client_name.textContent = client.profile.first_name + ' ' + client.profile.last_name
            client_name.hidden = false
            profile_first_name.textContent = client.profile.first_name
            profile_last_name.textContent = client.profile.last_name
            profile_email.textContent = client.profile.email
            profile_country.textContent = client.profile.country
            logout.hidden = false
            let activeMenu = document.getElementById('menu_' + localStorage.left_side_menu)
            activeMenu.classList.add('active')
            let activeView = document.getElementById('view_' + localStorage.left_side_menu)
            activeView.hidden = false
            left_side_menu.hidden = false
            if (localStorage.left_side_menu == 'terminal') initChart()
        } else {
            login_form.hidden = false
        }

        let currentPrice = {
            EURUSD: 1.2,
            GBPUSD: 1.7,
            USDJPY: 20,
            XAUUSD: 3403,
            BTCUSD: 65031
        }
        let currentVolume = {
            EURUSD: 1e4,
            GBPUSD: 2e3,
            USDJPY: 7e4,
            XAUUSD: 2e5,
            BTCUSD: 1e6
        }
        const getCurrentPrice = symbol => currentPrice[symbol] * (1 + (0.5 - Math.random()) / 20)
        const generateCandle = (symbol, time, closePricePrevCandle) => {
            let open = closePricePrevCandle
            let close = closePricePrevCandle * (1 + (0.5 - Math.random()) / 20)
            return {
                time,
                open,
                close,
                high: Math.max(open, close) * (1 + Math.random() / 30),
                low: Math.min(open, close) * (1 - Math.random() / 30),
                volume: Math.floor(currentVolume[symbol] * (1 + (0.5 - Math.random()) / 20))
            }
        }
        const getHistory1d = (symbol, days) => {
            let candles = []
            let price = currentPrice[symbol]
            let timeNowSec = Date.now() / 1000
            let oneDaySec = 60 * 60 * 24
            let timeFirstCandle = timeNowSec - oneDaySec * days
            for (let time = timeFirstCandle; time <= timeNowSec; time += oneDaySec) {
                const candle = generateCandle(symbol, time, price)
                price = candle.close
                candles.push(candle)
            }
            return candles
        }
    </script>
</body>
</html>
